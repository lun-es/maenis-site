<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La collection · Maison Marwil</title>
<meta name="description" content="iPhone, MacBook, iPad, AirPods et Samsung Galaxy, neufs et reconditionnés, livrés à Douala et Yaoundé.">
<meta property="og:url" content="https://maenisstudio.com/marwil/collection.html">
<link rel="canonical" href="https://maenisstudio.com/marwil/collection.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Maison Marwil">
<meta property="og:title" content="Produits · Maison Marwil">
<meta property="og:description" content="iPhone, MacBook, iPad, AirPods et Samsung Galaxy, neufs et reconditionnés, livrés à Douala et Yaoundé.">
<meta property="og:image" content="https://maenisstudio.com/marwil/images/partage.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Manrope:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="commun.css">
<style>
.etats { display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--filet); }
@media (min-width: 900px) { .etats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; border-top: 0; } }
.etat { display: flex; flex-direction: column; gap: 8px; padding: 22px 0; border-bottom: 1px solid var(--filet); }
@media (min-width: 900px) { .etat { border-bottom: 0; border-top: 1px solid var(--filet); } }
.etat h3 { font-size: 30px; }
.etat p { color: var(--gris); font-size: 15px; }
.etat .bat { color: var(--encre); font-weight: 600; font-size: 14px; }
.cats { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; margin-inline: calc(-1 * max(20px, env(safe-area-inset-left, 0px))); padding-inline: max(20px, env(safe-area-inset-left, 0px)); }
.cats::-webkit-scrollbar { display: none; }
.cats.suite { -webkit-mask-image: linear-gradient(to right, #000 78%, transparent); mask-image: linear-gradient(to right, #000 78%, transparent); }
.cats a { flex: none; text-decoration: none; padding: 12px 0; min-height: 48px; display: inline-flex; align-items: center; font-size: 14px; color: var(--gris); border-bottom: 1px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.cats a[aria-current="page"] { color: var(--encre); border-bottom-color: var(--encre); }
.attente-cat { display: flex; flex-direction: column; gap: 28px; padding: clamp(28px, 6vw, 56px); background: var(--papier-2); max-width: 820px; }
</style>
</head>
<body data-page="collection">
<main>
<section class="section gut" aria-labelledby="t1" style="padding-top:clamp(32px,6vw,70px)">
  <div class="wrap">
    <nav class="onglets cats" id="cats" aria-label="Catégories"></nav>
    <div class="titre" id="tete" style="margin-top:clamp(40px,7vw,72px)"></div>
    <div class="grille compacte" id="grille"></div>
    <div class="attente-cat" id="bientot" hidden></div>
  </div>
</section>
</main>
<script src="catalogue.js"></script>
<script src="monogramme.js"></script>
<script src="commun.js"></script>
<script>
(function () {
  const M = MARWIL, $ = id => document.getElementById(id);
  const cat = M.categories.find(c => c.id === new URLSearchParams(location.search).get("cat")) || M.categories[0];
  document.title = cat.nom + " · Maison Marwil";
  $("cats").innerHTML = M.categories.map(c => `<a href="?cat=${c.id}"${c === cat ? ' aria-current="page"' : ""}>${c.nom}</a>`).join("");
  $("tete").innerHTML = `<h1 id="t1">${cat.nom}</h1><p class="lead">${cat.accroche}</p>`;
  if (cat.dispo) {
    const tous = M.modeles; M.chargerPrix().then(() => { M.modeles = tous.filter(m => m.categorie === cat.id); M.cartes($("grille")); M.modeles = tous; });
  } else {
    $("grille").hidden = true; $("bientot").hidden = false;
    $("bientot").innerHTML = `<p class="lead">Pas encore en ligne. Dites-nous le modèle que vous cherchez : nous le trouvons à Paris.</p>
      <div class="ctas" style="display:flex;gap:12px 24px;flex-wrap:wrap;align-items:center"><a class="btn" href="${M.wa("Bonjour Maison Marwil, je cherche un appareil " + cat.nom + " : ")}" target="_blank" rel="noopener">Demander un ${cat.nom}</a><a class="link" href="?cat=iphone">Voir les iPhone</a></div>`;
  }
})();
// onglets : on montre qu'il y en a d'autres à droite, et l'onglet choisi est toujours visible
(function () { const n = document.getElementById("cats"); if (!n) return;
  const maj = () => n.classList.toggle("suite", n.scrollLeft + n.clientWidth < n.scrollWidth - 4);
  const actif = n.querySelector('[aria-current="page"]'); if (actif) n.scrollLeft = Math.max(0, actif.offsetLeft - n.clientWidth / 2 + actif.offsetWidth / 2);
  n.addEventListener("scroll", maj, { passive: true }); addEventListener("resize", maj); maj();
})();
</script>
</body>
</html>
